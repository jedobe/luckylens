<title>네잎클로버 파인더 (LuckyLens)</title>
<style>
  :root { --ink:#1d2a1f; --muted:#5c6b60; --leaf:#2f8a46; --bg:#f7f9f5; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8efe9; --muted:#9aa89e; --leaf:#5cc477; --bg:#121713; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 8px; } a { color:var(--leaf); } p { color:var(--muted); }
</style>

<body>
<main>
<h1>🍀 네잎클로버 파인더 (LuckyLens)</h1>
<p>클로버 군락을 찍으면 네잎 클로버가 있을 만한 곳을 짚어 주는 앱입니다. 사진은 휴대폰 안에서만 분석됩니다.</p>
<p>Point your phone at a clover patch and the app marks where a four-leaf clover may be. Photos never leave your phone.</p>
